name: astrbot_plugin_persona_editor
display_name: 人格设定编辑器
short_desc: 按「对」编辑对话示例，整份人格能导出成文件、也能导回来。
desc: >-
  自带的人格编辑页只能往对话示例末尾追加，中间插不进、顺序也调不了。
  这个插件把示例拆成一个一个「对」：每一对能单独改、拖动排序、在上下方插入空对、
  复制、删除，末尾还能继续加。系统提示词、工具和技能也能编辑，带字数统计和未保存提示。
  保存是整份写回，不做增量，避免改一半。只调人格管理器的公开方法，不碰数据库和本体。
  这一版补上了整份导出与导入：导出会把提示词、示例、工具、技能、报错话术写进一个文件；
  导入时能改人格标识，结尾被助手加上去的导入后缀会自动去掉，重名可以选覆盖或跳过。
help: >-
  装好后在插件卡片点「查看界面」。顶部选择人格，左右两栏分别编辑，改完点保存。
  「导出」把当前人格整份存成文件，「导出全部」把所有人格打成一个包；
  「导入」选好文件后可以逐个改名字、选新建或覆盖，确认后一次写进去。
  读取时兼容数据库里列表与字符串两种存法；写入统一成列表。
version: 1.1.0
author: 咱
repo: https://github.com/3303339695/astrbot_plugin_persona_editor
astrbot_version: ">=4.20.0"
